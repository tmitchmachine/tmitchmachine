name: Update projects page

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild repo list
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python scripts/update_projects.py

      - name: Commit changes
        run: |
          if git diff --quiet lib/projects.ts; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add lib/projects.ts
          git commit -m "Update projects page with latest repos and commit counts"
          git push
